# ⚡ v1.8.1: detekt Configuration
# Pragmatic rules for simple-notes-sync

build:
  maxIssues: 0  # v1.8.1: All issues resolved
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

comments:
  CommentOverPrivateProperty:
    active: false
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false

complexity:
  ComplexCondition:
    active: true
    threshold: 5
  CyclomaticComplexMethod:
    active: true
    threshold: 15  # v2.14.0: Zielwert (TECH_DEBT_ROADMAP.md). Bestandsklassen per @Suppress markiert.
    ignoreSingleWhenExpression: true
  LargeClass:
    active: true
    threshold: 400  # v2.14.0: Zielwert (TECH_DEBT_ROADMAP.md). Bestandsklassen per @Suppress markiert.
  LongMethod:
    active: true
    threshold: 80  # v2.14.0: Zielwert (TECH_DEBT_ROADMAP.md). Bestandsmethoden per @Suppress markiert.
  LongParameterList:
    active: true
    functionThreshold: 10  # v1.5.0: Compose functions often have many params
    constructorThreshold: 7
  NestedBlockDepth:
    active: true
    threshold: 5
  TooManyFunctions:
    active: true
    thresholdInFiles: 20  # v2.14.0: Zielwert (TECH_DEBT_ROADMAP.md)
    thresholdInClasses: 20  # v2.14.0: Zielwert (TECH_DEBT_ROADMAP.md)
    thresholdInInterfaces: 20
    thresholdInObjects: 20
    thresholdInEnums: 10

empty-blocks:
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: "_|(ignore|expected).*"
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true

exceptions:
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - "InterruptedException"
      - "MalformedURLException"
      - "NumberFormatException"
      - "ParseException"
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - "Error"
      - "Throwable"
    allowedExceptionNameRegex: "_|(ignore|expected).*"

naming:
  FunctionNaming:
    active: true
    functionPattern: "[a-zA-Z][a-zA-Z0-9]*"
  VariableNaming:
    active: true
    variablePattern: "[a-z][A-Za-z0-9]*"
  PackageNaming:
    active: true
    packagePattern: "[a-z]+(\\.[a-z][A-Za-z0-9]*)*"

performance:
  SpreadOperator:
    active: false  # Spread operator is fine in most cases

potential-bugs:
  CastToNullableType:
    active: true
  EqualsWithHashCodeExist:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true

style:
  ForbiddenComment:
    active: true
    comments:
      - "FIXME:"
      - "STOPSHIP:"
    allowedPatterns: ""
  ForbiddenImport:
    active: true
    includes: ['**/widget/**']
    excludes: ['**/widget/*Config*.kt']
    imports:
      - value: 'androidx.compose.ui.platform.LocalContext'
        reason: 'Glance stellt die Compose-UI-CompositionLocals nicht bereit — LocalContext.current wirft dort zur Laufzeit. In Glance-Code androidx.glance.LocalContext verwenden.'
  MagicNumber:
    active: true
    ignoreNumbers:
      - "-1"
      - "0"
      - "1"
      - "2"
      - "100"
      - "1000"
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreAnnotation: true
    ignoreEnums: true
    ignoreRanges: true
    ignoreExtensionFunctions: true
  MaxLineLength:
    active: true
    maxLineLength: 140  # v1.5.0: Increased for Compose code readability
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: true
  ReturnCount:
    active: true
    max: 4
    excludedFunctions:
      - 'moveDraggingItemToEnd'  # IMPL_29k: 7 early-return guard clauses (viewport/flapping/mutex checks)
      - 'trySwapOnDrag'  # IMPL_29o O2: +1 cascade guard return (now 5 returns)
    excludeLabeled: true
    excludeReturnFromLambda: true
    excludeGuardClauses: true
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
    allowedNames: "_.*"
  WildcardImport:
    active: false  # Allow wildcard imports
