name: Release
on:
  push:
    tags:
      # Finale Versionen → Draft-Release wie bisher.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      # Pre-Releases → sofort veröffentlichtes Pre-Release (siehe draft/prerelease unten).
      #
      # Beta-Tags sind erst seit fdroiddata!43948 gefahrlos: davor griff der F-Droid-Update-Bot
      # JEDEN Tag ab und hätte eine Beta als reguläres Update ausgeliefert. Seitdem steht dort
      # `UpdateCheckMode: Tags ^v[\d.]+$`, was am Bindestrich scheitert. Wer diesen Filter hier
      # erweitert, muss den Regex drüben mitziehen.
      - 'v[0-9]+.[0-9]+.[0-9]+-beta*'
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version info
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BUILD_NUMBER=$(grep "versionCode = " android/app/build.gradle.kts | sed 's/.*versionCode = \([0-9]*\).*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          # Ein Bindestrich im Tag heißt Pre-Release (v2.14.0-beta1). Der baut den
          # `beta`-Build-Typ, damit Sideloader dieselben Diagnose-Defaults bekommen wie die
          # Tester im Play-Testtrack. F-Droid liefert keine Testtracks aus, `fdroidBeta` ist
          # als Variante abgeschaltet — daher nur eine APK statt zwei.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi
          echo "🚀 Building version: $VERSION (Code: $BUILD_NUMBER)"

      - name: Configure Android signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/simple-notes-release.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=simple-notes-release.jks" >> android/key.properties
          echo "✅ Signing configuration created"

      - name: Build APKs
        run: |
          cd android
          if [ "${{ steps.version.outputs.IS_PRERELEASE }}" = "true" ]; then
            ./gradlew assembleStandardBeta --no-daemon --stacktrace
          else
            ./gradlew assembleStandardRelease assembleFdroidRelease --no-daemon --stacktrace
          fi

      - name: Run tests
        run: cd android && ./gradlew testFdroidReleaseUnitTest testStandardReleaseUnitTest

      - name: Copy APKs with version names
        run: |
          mkdir -p apk-output
          VERSION=${{ steps.version.outputs.VERSION }}
          if [ "${{ steps.version.outputs.IS_PRERELEASE }}" = "true" ]; then
            cp android/app/build/outputs/apk/standard/beta/app-standard-beta.apk \
               apk-output/simple-notes-sync-v${VERSION}-standard.apk
          else
            cp android/app/build/outputs/apk/standard/release/app-standard-release.apk \
               apk-output/simple-notes-sync-v${VERSION}-standard.apk
            cp android/app/build/outputs/apk/fdroid/release/app-fdroid-release.apk \
               apk-output/simple-notes-sync-v${VERSION}-fdroid.apk
          fi
          echo "✅ APK files prepared:"
          ls -lh apk-output/

      - name: Read F-Droid changelogs
        run: |
          BUILD_NUMBER=${{ steps.version.outputs.BUILD_NUMBER }}
          # Beta-Bumps erhöhen den versionCode, ohne dass eine neue Changelog-Datei
          # dazukommt (v2.14.0 = 49.txt, Beta-Bump = Code 50). Dann gilt dieselbe
          # Fallback-Regel wie in deploy-google-play.yml und copyChangelogsToAssets:
          # neueste vorhandene Datei nehmen, statt die Release-Notes leer zu lassen.
          read_changelog() {
            local dir="fastlane/metadata/android/$1/changelogs"
            local file="$dir/$BUILD_NUMBER.txt"
            if [ ! -f "$file" ]; then
              file=$(ls "$dir"/*.txt 2>/dev/null | sort -V | tail -1)
              echo "No $BUILD_NUMBER.txt in $dir — falling back to ${file:-<none>}" >&2
            fi
            [ -n "$file" ] && cat "$file"
          }
          {
            echo "CHANGELOG_DE<<GHADELIMITER"
            read_changelog de-DE || true
            echo "GHADELIMITER"
            echo "CHANGELOG_EN<<GHADELIMITER"
            read_changelog en-US || true
            echo "GHADELIMITER"
          } >> $GITHUB_ENV

      - name: Compose downloads section
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          echo "DOWNLOADS<<GHADELIMITER" >> $GITHUB_ENV
          if [ "${{ steps.version.outputs.IS_PRERELEASE }}" = "true" ]; then
            cat <<EOF >> $GITHUB_ENV
          > **This is a beta build.** Diagnostic logging is on by default so you can attach a sync
          > log to a report - Settings → Debug & Diagnostics to export or switch it off. Exported
          > logs have your server address, user name and note titles replaced. It is signed with
          > the same key as the release builds, so it installs over a normal install and back.
          > Not published on F-Droid.

          | Variant | File | Info |
          |---------|------|------|
          | **Beta** | \`simple-notes-sync-v${VERSION}-standard.apk\` | Works on all devices |
          EOF
          else
            cat <<EOF >> $GITHUB_ENV
          | Variant | File | Info |
          |---------|------|------|
          | **🏆 Recommended** | \`simple-notes-sync-v${VERSION}-standard.apk\` | Standard version (works on all devices) |
          | F-Droid | \`simple-notes-sync-v${VERSION}-fdroid.apk\` | For F-Droid Store |
          EOF
          fi
          echo "GHADELIMITER" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "📝 Simple Notes Sync v${{ steps.version.outputs.VERSION }}"
          # Finale Releases bleiben Draft (manuell prüfen und veröffentlichen).
          # Pre-Releases gehen direkt raus, sonst wartet der Tester auf einen Klick.
          draft: ${{ steps.version.outputs.IS_PRERELEASE != 'true' }}
          prerelease: ${{ steps.version.outputs.IS_PRERELEASE == 'true' }}
          generate_release_notes: false
          files: apk-output/*.apk
          body: |
            ## 📋 Changelog / Release Notes

            ${{ env.CHANGELOG_EN }}

            <details>
            <summary>🇩🇪 German Version</summary>

            ${{ env.CHANGELOG_DE }}

            </details>

            ## 📦 Downloads

            ${{ env.DOWNLOADS }}

            ## 📊 Build Info

            - **Version:** ${{ steps.version.outputs.VERSION }} (Code: ${{ steps.version.outputs.BUILD_NUMBER }})
            - **Commit:** ${{ github.sha }}

            ## 🔐 APK Signature Verification

            All APKs are signed with the official release certificate.

            **Recommended:** Verify with [AppVerifier](https://github.com/nicholson-lab/AppVerifier) (Android app)

            **Expected SHA-256:**
            ```
            42:A1:C6:13:BB:C6:73:04:5A:F3:DC:81:91:BF:9C:B6:45:6E:E4:4C:7D:CE:40:C7:CF:B5:66:FA:CB:69:F1:6A
            ```

            **[📖 Documentation](https://github.com/inventory69/simple-notes-sync/blob/main/QUICKSTART.md)** · **[🐛 Report Bug](https://github.com/inventory69/simple-notes-sync/issues)**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Immer nur die neueste Beta stehen lassen. Ohne das sammeln sich die Pre-Releases,
      # und Tester laden irgendwann eine alte APK. Filter ist `isPrerelease` — finale
      # Releases sind das nie, auch nicht als Draft, und bleiben damit unangetastet.
      # Der Tag bleibt stehen: er dokumentiert, was gebaut wurde, und F-Droid ignoriert
      # Beta-Tags ohnehin am Regex.
      - name: Prune older pre-releases
        if: steps.version.outputs.IS_PRERELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isPrerelease \
            --jq ".[] | select(.isPrerelease) | select(.tagName != \"$GITHUB_REF_NAME\") | .tagName" \
          | while read -r tag; do
              echo "Removing superseded pre-release $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            done
